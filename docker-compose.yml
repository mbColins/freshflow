services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set in Coolify (Environment Variables, enable "Build Variable").
        # Must be an https:// URL.
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        # Set to 1 in Coolify only for test deployments that use an http:// API.
        # Leave unset for production so the https check stays active.
        ALLOW_INSECURE_API: ${ALLOW_INSECURE_API:-}
    restart: unless-stopped
    # Coolify's proxy routes the domain to this port.
    # Set the domain in Coolify as https://your-domain.com:8080
    expose:
      - "8080"
    # Direct access for testing at http://<server-ip>:3000. Remove once the
    # app is served only through a domain.
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
